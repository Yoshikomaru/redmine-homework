services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redmine-net

  redmine:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER}/redmine-homework:1.0
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDMINE_DB_DATABASE: redmine
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?Set REDMINE_SECRET_KEY_BASE}
    volumes:
      - redmine-files:/usr/src/redmine/files
    networks:
      - redmine-net
    depends_on:
      - db

volumes:
  postgres-data:
  redmine-files:

networks:
  redmine-net:
    driver: bridge
